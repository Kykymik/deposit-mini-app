<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DEPOSIT</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--gold:#f5c451;--bg:#090909;--card:#151515;--muted:#969696;--green:#35d07f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}
button{cursor:pointer;border:0;font-weight:bold}
header{padding:22px 18px 12px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:27px;font-weight:900;letter-spacing:2px;color:var(--gold)}
.badge{border:1px solid #57451c;border-radius:20px;padding:7px 10px;color:var(--gold);font-size:11px}
main{padding:10px 15px 90px;max-width:600px;margin:auto}
.balance{background:linear-gradient(135deg,#29200d,#15130d 60%,#171717);border:1px solid #58451e;border-radius:20px;padding:20px;margin-bottom:18px;position:relative;overflow:hidden}
.balance:after{content:"";position:absolute;width:140px;height:140px;border-radius:50%;border:1px solid #80621d;right:-50px;top:-55px;opacity:.5}
.label{font-size:12px;color:#bbb}
.amount{font-size:30px;font-weight:900;margin:8px 0;color:var(--gold)}
.row{display:flex;gap:10px}
.action{flex:1;padding:13px 8px;border-radius:12px;background:var(--gold);color:#17120a}
.action.secondary{background:#28251e;color:var(--gold);border:1px solid #5c4821}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:23px 2px 12px}
.section-title h2{font-size:17px;margin:0}
.section-title span{font-size:11px;color:var(--muted)}
.games{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.game{background:var(--card);border:1px solid #292929;border-radius:17px;padding:15px 12px;text-align:left;color:white;min-height:145px;transition:transform .2s,border-color .2s;position:relative;overflow:hidden}
.game:active{transform:scale(.97)}
.game .emoji{font-size:35px;display:block;margin-bottom:10px}
.game strong{font-size:15px}
.game small{display:block;color:var(--muted);margin-top:5px}
.game .play{position:absolute;right:12px;bottom:12px;color:var(--gold);font-size:20px}
.panel{display:none;background:#121212;border:1px solid #3a3019;border-radius:18px;padding:16px;margin-top:15px;animation:appear .25s ease}
.panel.active{display:block}
@keyframes appear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.gamehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.gamehead h3{margin:0;color:var(--gold)}
.close{background:#292929;color:#fff;border-radius:8px;padding:7px 11px}
.betrow{display:flex;gap:8px;margin:12px 0}
input{min-width:0;flex:1;background:#080808;color:white;border:1px solid #393939;border-radius:10px;padding:12px;font-size:15px}
.goldbtn{width:100%;padding:13px;border-radius:11px;background:var(--gold);color:#111;margin-top:10px}
.status{text-align:center;color:var(--muted);font-size:13px;min-height:20px;margin:12px 0}
.minegrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cell{aspect-ratio:1;background:#282821;border:1px solid #464127;border-radius:8px;color:white;font-size:20px;transition:.2s}
.cell.open{background:#164a32;border-color:#2fa96b;animation:appear .2s}
.cell.boom{background:#692222;animation:shake .25s}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.planearea{height:180px;background:radial-gradient(ellipse at bottom,#2d230d,#101010 70%);border-radius:12px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.multiplier{font-size:38px;font-weight:900;color:var(--gold);z-index:1}
.plane{position:absolute;font-size:40px;left:10%;bottom:15px;transition:left .2s,bottom .2s;filter:drop-shadow(0 0 12px #f5c451)}
.slotrow{display:flex;gap:8px;justify-content:center;margin:20px 0}
.reel{width:30%;height:75px;background:#252115;border:1px solid #66501e;border-radius:12px;display:grid;place-items:center;font-size:38px}
.dice{font-size:70px;text-align:center;padding:15px;transition:transform .4s}
.dice.roll{animation:roll .5s}
@keyframes roll{0%{transform:rotate(0) scale(.7)}50%{transform:rotate(220deg) scale(1.2)}100%{transform:rotate(360deg) scale(1)}}
nav{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #282828;display:flex;justify-content:space-around;padding:12px 4px calc(12px + env(safe-area-inset-bottom));z-index:5}
nav button{background:none;color:#999;font-size:11px}
nav button b{display:block;font-size:20px;margin-bottom:4px}
nav button.selected{color:var(--gold)}
.note{text-align:center;font-size:10px;color:#666;margin-top:22px}
</style>
</head>
<body>
<header>
  <div class="logo">✦ DEPOSIT</div>
  <div class="badge">● DEMO MODE</div>
</header>
<main>
  <div class="balance">
    <div class="label">ТВОЙ ДЕМО-БАЛАНС</div>
    <div class="amount" id="balance">100 000 UZS</div>
    <div class="row">
      <button class="action" onclick="deposit()">＋ Пополнить</button>
      <button class="action secondary" onclick="withdraw()">↗ Вывести</button>
    </div>
  </div>

  <div class="section-title"><h2>🎮 Игры</h2><span>ВЫБЕРИ ИГРУ</span></div>
  <div class="games">
    <button class="game" onclick="openGame('mines')"><span class="emoji">💣</span><strong>Mines</strong><small>Найди безопасные клетки</small><span class="play">↗</span></button>
    <button class="game" onclick="openGame('aviator')"><span class="emoji">✈️</span><strong>Aviator</strong><small>Следи за полётом</small><span class="play">↗</span></button>
    <button class="game" onclick="openGame('slots')"><span class="emoji">🎰</span><strong>Slots</strong><small>Крути барабаны</small><span class="play">↗</span></button>
    <button class="game" onclick="openGame('dice')"><span class="emoji">🎲</span><strong>Dice</strong><small>Бросай кубик</small><span class="play">↗</span></button>
  </div>

  <section class="panel" id="panel">
    <div class="gamehead"><h3 id="gameTitle">Игра</h3><button class="close" onclick="closeGame()">✕</button></div>
    <div id="gameBody"></div>
  </section>
  <div class="note">DEPOSIT · ДЕМОНСТРАЦИОННАЯ ВЕРСИЯ · ВИРТУАЛЬНЫЕ UZS</div>
</main>
<nav>
  <button class="selected" onclick="scrollTop()"><b>⌂</b>Главная</button>
  <button onclick="openGame('mines')"><b>💣</b>Mines</button>
  <button onclick="openGame('aviator')"><b>✈️</b>Aviator</button>
  <button onclick="showWallet()"><b>◈</b>Баланс</button>
</nav>
<script>
const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();try{tg.setHeaderColor('#090909');tg.setBackgroundColor('#090909')}catch(e){}}

let balance=100000;
let currentGame='';
let busy=false;
let mineState=null;
let flightTimer=null;

const fmt=n=>Math.floor(n).toLocaleString('ru-RU')+' UZS';
function updateBalance(){document.getElementById('balance').textContent=fmt(balance)}
function showWallet(){document.querySelector('.balance').scrollIntoView({behavior:'smooth'})}
function scrollTop(){window.scrollTo({top:0,behavior:'smooth'})}
function deposit(){alert('Это демоверсия. Реальное пополнение пока не подключено.')}
function withdraw(){alert('Это демоверсия. Реальный вывод пока не подключён.')}
function closeGame(){
  if(flightTimer){clearInterval(flightTimer);flightTimer=null}
  document.getElementById('panel').classList.remove('active');
  busy=false;
}
function openGame(name){
  if(flightTimer){clearInterval(flightTimer);flightTimer=null}
  currentGame=name;
  const panel=document.getElementById('panel');
  panel.classList.add('active');
  const titles={mines:'💣 MINES',aviator:'✈️ AVIATOR',slots:'🎰 SLOTS',dice:'🎲 DICE'};
  document.getElementById('gameTitle').textContent=titles[name];
  const body=document.getElementById('gameBody');
  if(name==='mines')renderMines(body);
  if(name==='aviator')renderAviator(body);
  if(name==='slots')renderSlots(body);
  if(name==='dice')renderDice(body);
  setTimeout(()=>panel.scrollIntoView({behavior:'smooth',block:'nearest'}),50);
}
function getBet(){
  const bet=Number(document.getElementById('bet').value);
  if(!Number.isFinite(bet)||bet<1000||bet>balance){alert('Ставка должна быть от 1 000 UZS до размера баланса.');return 0}
  return Math.floor(bet);
}
function renderMines(body){
  mineState={opened:[],bomb:Math.floor(Math.random()*25),bet:0,active:false};
  body.innerHTML=`<div class="label">Ставка (виртуальные UZS)</div><div class="betrow"><input id="bet" type="number" value="1000" min="1000" step="1000"></div><div class="minegrid" id="minegrid"></div><div class="status" id="status">Выбери ставку и начни игру</div><button class="goldbtn" id="startMine" onclick="startMines()">Начать игру</button><button class="goldbtn" id="cashMine" style="display:none" onclick="cashMines()">Забрать выигрыш</button>`;
  const grid=document.getElementById('minegrid');
  for(let i=0;i<25;i++){const b=document.createElement('button');b.className='cell';b.textContent='?';b.onclick=()=>pickMine(i,b);grid.appendChild(b)}
}
function startMines(){
  if(mineState.active)return;
  const bet=getBet();if(!bet)return;
  balance-=bet;updateBalance();
  mineState={...mineState,opened:[],bomb:Math.floor(Math.random()*25),bet,active:true};
  document.querySelectorAll('.cell').forEach(c=>{c.className='cell';c.textContent='?'});
  document.getElementById('status').textContent='Открывай клетки. Каждая безопасная клетка увеличивает выигрыш!';
  document.getElementById('startMine').style.display='none';
  document.getElementById('cashMine').style.display='block';
}
function pickMine(i,el){
  if(!mineState?.active||mineState.opened.includes(i))return;
  if(i===mineState.bomb){
    el.classList.add('boom');el.textContent='💣';
    document.getElementById('status').textContent='Бомба! Ставка потеряна.';
    mineState.active=false;revealBomb();endMines();return;
  }
  mineState.opened.push(i);el.classList.add('open');el.textContent='💎';
  const mult=1+mineState.opened.length*.18;
  document.getElementById('status').textContent='Множитель x'+mult.toFixed(2)+' · Возможный возврат: '+fmt(mineState.bet*mult);
}
function revealBomb(){document.querySelectorAll('.cell').forEach((c,i)=>{if(i===mineState.bomb){c.textContent='💣';c.classList.add('boom')}})}
function cashMines(){
  if(!mineState?.active||!mineState.opened.length)return alert('Сначала открой хотя бы одну безопасную клетку.');
  const win=Math.floor(mineState.bet*(1+mineState.opened.length*.18));
  balance+=win;updateBalance();
  document.getElementById('status').textContent='Забрано: '+fmt(win)+' 🎉';
  mineState.active=false;endMines();
}
function endMines(){document.getElementById('cashMine').style.display='none';document.getElementById('startMine').style.display='block';document.getElementById('startMine').textContent='Играть ещё';}
function renderAviator(body){
  body.innerHTML=`<div class="label">Ставка (виртуальные UZS)</div><div class="betrow"><input id="bet" type="number" value="1000" min="1000" step="1000"></div><div class="planearea"><div class="multiplier" id="mult">x1.00</div><div class="plane" id="plane">✈️</div></div><div class="status" id="status">Нажми «Старт» и забери виртуальный выигрыш до конца полёта.</div><button class="goldbtn" id="flightBtn" onclick="startFlight()">✈ Старт</button>`;
}
function startFlight(){
  if(busy)return;
  const bet=getBet();if(!bet)return;
  balance-=bet;updateBalance();busy=true;
  let mult=1;
  const crash=1.15+Math.random()*3.85;
  const btn=document.getElementById('flightBtn');
  btn.textContent='Забрать x'+mult.toFixed(2);
  btn.onclick=()=>cashFlight(bet,mult);
  document.getElementById('status').textContent='Самолёт взлетел!';
  flightTimer=setInterval(()=>{
    mult+=.025+mult*.012;
    document.getElementById('mult').textContent='x'+mult.toFixed(2);
    document.getElementById('plane').style.left=Math.min(75,(mult-1)*18)+'%';
    document.getElementById('plane').style.bottom=Math.min(70,(mult-1)*15+15)+'px';
    btn.textContent='Забрать x'+mult.toFixed(2);
    if(mult>=crash){
      clearInterval(flightTimer);flightTimer=null;busy=false;
      document.getElementById('status').textContent='Самолёт улетел! Ставка потеряна.';
      document.getElementById('plane').textContent='💨';
      btn.textContent='Играть ещё';btn.onclick=()=>{renderAviator(document.getElementById('gameBody'))};
    }
  },100);
}
function cashFlight(bet,mult){
  if(!busy)return;
  if(flightTimer){clearInterval(flightTimer);flightTimer=null}
  busy=false;
  const win=Math.floor(bet*mult);balance+=win;updateBalance();
  document.getElementById('status').textContent='Ты забрал '+fmt(win)+' 🎉';
  const btn=document.getElementById('flightBtn');btn.textContent='Играть ещё';btn.onclick=()=>{renderAviator(document.getElementById('gameBody'))};
}
function renderSlots(body){
  body.innerHTML=`<div class="label">Ставка (виртуальные UZS)</div><div class="betrow"><input id="bet" type="number" value="1000" min="1000" step="1000"></div><div class="slotrow"><div class="reel" id="r1">🍒</div><div class="reel" id="r2">⭐</div><div class="reel" id="r3">💎</div></div><div class="status" id="status">Три одинаковых символа — большой демо-выигрыш!</div><button class="goldbtn" id="slotBtn" onclick="spinSlots()">🎰 Крутить</button>`;
}
function spinSlots(){
  if(busy)return;
  const bet=getBet();if(!bet)return;
  balance-=bet;updateBalance();busy=true;
  const symbols=['🍒','⭐','💎','7️⃣','🔔'];
  const reels=[1,2,3].map(i=>document.getElementById('r'+i));
  let ticks=0;
  document.getElementById('slotBtn').disabled=true;
  const timer=setInterval(()=>{
    reels.forEach(r=>{r.textContent=symbols[Math.floor(Math.random()*symbols.length)]});
    ticks++;
    if(ticks>=12){
      clearInterval(timer);busy=false;
      const vals=reels.map(r=>r.textContent);
      let mult=vals.every(v=>v===vals[0])?5:(vals[0]===vals[1]||vals[1]===vals[2]||vals[0]===vals[2]?2:0);
      const win=Math.floor(bet*mult);
      if(win){balance+=win;updateBalance()}
      document.getElementById('status').textContent=win?'Выигрыш '+fmt(win)+' 🎉':'Не повезло. Попробуй ещё!';
      document.getElementById('slotBtn').disabled=false;
    }
  },100);
}
function renderDice(body){
  body.innerHTML=`<div class="label">Ставка (виртуальные UZS)</div><div class="betrow"><input id="bet" type="number" value="1000" min="1000" step="1000"></div><div class="dice" id="dice">🎲</div><div class="status" id="status">Брось кубик. 4, 5 или 6 дают виртуальный выигрыш x2.</div><button class="goldbtn" id="diceBtn" onclick="rollDice()">Бросить кубик</button>`;
}
function rollDice(){
  if(busy)return;
  const bet=getBet();if(!bet)return;
  balance-=bet;updateBalance();busy=true;
  const dice=document.getElementById('dice'),btn=document.getElementById('diceBtn');
  btn.disabled=true;dice.classList.remove('roll');void dice.offsetWidth;dice.classList.add('roll');
  let ticks=0;
  const timer=setInterval(()=>{
    const n=Math.floor(Math.random()*6)+1;
    dice.textContent=['⚀','⚁','⚂','⚃','⚄','⚅'][n-1];
    ticks++;
    if(ticks>=8){
      clearInterval(timer);busy=false;btn.disabled=false;
      const win=n>=4?bet*2:0;
      if(win){balance+=win;updateBalance()}
      document.getElementById('status').textContent=win?'Выпало '+n+'! Выигрыш '+fmt(win)+' 🎉':'Выпало '+n+'. В этот раз без выигрыша.';
    }
  },100);
}
updateBalance();
</script>
</body>
</html>
