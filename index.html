<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>DEPOSIT</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--gold:#f4c451;--bg:#090909;--card:#171717;--muted:#aaa;--green:#36d58a;--red:#ff6868}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}
button,input{font:inherit}
button{cursor:pointer}
header{padding:20px 16px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:25px;font-weight:900;letter-spacing:2px;color:var(--gold)}
.demo{font-size:10px;border:1px solid #65501e;color:var(--gold);border-radius:20px;padding:7px}
main{max-width:560px;margin:auto;padding:0 14px 35px}
.card{background:var(--card);border:1px solid #302a1c;border-radius:17px;padding:17px;margin-bottom:14px}
.balance{background:linear-gradient(130deg,#30240b,#171717 75%);border-color:#68501c}
.muted{color:var(--muted);font-size:12px}
.amount{font-size:29px;color:var(--gold);font-weight:900;margin:8px 0 17px;overflow-wrap:anywhere}
.actions{display:flex;gap:9px}
.btn{background:var(--gold);color:#161107;border:0;border-radius:11px;padding:13px 10px;font-weight:bold;min-height:45px}
.btn.secondary{background:#28251e;color:var(--gold);border:1px solid #59471e}
.actions .btn{flex:1}
h2{font-size:18px;margin:22px 2px 12px}
.games{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.game{position:relative;text-align:left;min-height:132px;background:#171717;border:1px solid #302d26;border-radius:16px;color:white;padding:14px;transition:transform .2s,border-color .2s}
.game:active{transform:scale(.96);border-color:var(--gold)}
.icon{font-size:34px;display:block;margin-bottom:9px}
.game strong{font-size:15px}
.game small{display:block;color:#aaa;font-size:11px;margin-top:6px}
.panel{display:none;margin-top:14px}
.panel.show{display:block;animation:appear .25s ease}
@keyframes appear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.game-title{display:flex;justify-content:space-between;align-items:center;color:var(--gold);font-weight:bold;margin-bottom:14px}
.close{background:#292929;color:white;border:0;border-radius:8px;padding:8px 12px}
input{width:100%;background:#090909;border:1px solid #47402e;border-radius:10px;padding:13px;color:white;margin:8px 0 12px;font-size:16px}
.full{width:100%}
.status{text-align:center;color:#bbb;font-size:13px;min-height:22px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cell{aspect-ratio:1;border:1px solid #4b422a;background:#29271f;border-radius:8px;color:white;font-size:20px;transition:transform .2s}
.cell.open{background:#155335;animation:pop .3s}
.cell.boom{background:#722424;animation:shake .3s}
@keyframes pop{50%{transform:scale(1.14)}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.planearea{height:160px;background:radial-gradient(ellipse at bottom,#38290b,#101010 70%);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.mult{font-size:35px;font-weight:900;color:var(--gold)}
.plane{font-size:37px;display:block;transition:transform .12s}
.reels{display:flex;gap:8px;margin:15px 0}
.reel{flex:1;text-align:center;font-size:36px;padding:15px 0;background:#272115;border:1px solid #5c4820;border-radius:10px}
.spin{animation:spin .12s infinite alternate}
@keyframes spin{to{transform:translateY(5px);filter:brightness(1.5)}}
.dice{font-size:70px;text-align:center;padding:15px}
.roll{animation:roll .5s ease}
@keyframes roll{50%{transform:rotate(220deg) scale(1.2)}}
.notice{font-size:11px;text-align:center;color:#777;margin:20px 0}
.overlay{display:none;position:fixed;inset:0;background:#000c;z-index:10;align-items:center;justify-content:center;padding:18px}
.overlay.show{display:flex}
.modal{width:100%;max-width:400px;background:#171717;border:1px solid #5b481e;border-radius:18px;padding:20px;animation:appear .2s}
.modal h3{color:var(--gold);margin-top:0}
.modal .btn{width:100%;margin-top:8px}
footer{text-align:center;color:#666;font-size:11px;padding:10px}
</style>
</head>
<body>
<header>
  <div class="logo">✦ DEPOSIT</div>
  <div class="demo">● DEMO MODE</div>
</header>

<main>
  <section class="card balance">
    <div class="muted">ТВОЙ ВИРТУАЛЬНЫЙ БАЛАНС</div>
    <div class="amount" id="balance">100 000 UZS</div>
    <div class="actions">
      <button class="btn" onclick="openMoney('deposit')">＋ Пополнить</button>
      <button class="btn secondary" onclick="openMoney('withdraw')">↗ Снять</button>
    </div>
  </section>

  <h2>🎮 Выбери игру</h2>
  <div class="games">
    <button class="game" onclick="openGame('mines')"><span class="icon">💣</span><strong>Mines</strong><small>Открывай клетки</small></button>
    <button class="game" onclick="openGame('aviator')"><span class="icon">✈️</span><strong>Aviator</strong><small>Следи за полётом</small></button>
    <button class="game" onclick="openGame('slots')"><span class="icon">🎰</span><strong>Slots</strong><small>Крути барабаны</small></button>
    <button class="game" onclick="openGame('dice')"><span class="icon">🎲</span><strong>Dice</strong><small>Бросай кубик</small></button>
  </div>

  <section class="card panel" id="gamePanel">
    <div class="game-title"><span id="gameTitle">Игра</span><button class="close" onclick="closeGame()">✕</button></div>
    <div class="muted">Ставка в виртуальных UZS</div>
    <input id="bet" type="number" min="1000" step="1000" value="1000">
    <div id="gameArea"></div>
    <div class="status" id="gameStatus">Готов к игре</div>
    <button class="btn full" id="playButton" onclick="play()">Начать игру</button>
  </section>

  <div class="notice">DEPOSIT · ДЕМО-ВЕРСИЯ · РЕАЛЬНЫЕ ПЛАТЕЖИ НЕ ПОДКЛЮЧЕНЫ</div>
</main>

<div class="overlay" id="moneyOverlay" onclick="if(event.target===this)closeMoney()">
  <div class="modal">
    <h3 id="moneyTitle">Пополнение</h3>
    <div class="muted" id="moneyDescription">Введи сумму в UZS</div>
    <input id="moneyAmount" type="number" min="1000" step="1000" value="10000">
    <button class="btn" onclick="submitMoney()">Продолжить</button>
    <button class="btn secondary" onclick="closeMoney()">Отмена</button>
    <div class="status" id="moneyStatus"></div>
  </div>
</div>

<footer>Играй ответственно · Только виртуальные средства</footer>

<script>
const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();try{tg.setHeaderColor('#090909');tg.setBackgroundColor('#090909')}catch(e){}}

let balance=100000;
let currentGame='';
let busy=false;
let mine=null;
let flightTimer=null;
let moneyMode='deposit';
let flightMultiplier=1;

const $=id=>document.getElementById(id);
const format=n=>Math.floor(n).toLocaleString('ru-RU')+' UZS';

function updateBalance(){$('balance').textContent=format(balance)}

function openMoney(mode){
  moneyMode=mode;
  $('moneyTitle').textContent=mode==='deposit'?'＋ Пополнение':'↗ Снятие средств';
  $('moneyDescription').textContent=mode==='deposit'?'Демо-пополнение виртуального баланса':'Демо-снятие виртуального баланса';
  $('moneyStatus').textContent='';
  $('moneyOverlay').classList.add('show');
}
function closeMoney(){$('moneyOverlay').classList.remove('show')}

function submitMoney(){
  const amount=Number($('moneyAmount').value);
  if(!Number.isFinite(amount)||amount<1000||!Number.isInteger(amount)){
    $('moneyStatus').textContent='Введи корректную сумму от 1 000 UZS.';
    return;
  }
  if(moneyMode==='deposit'){
    balance+=amount;
    updateBalance();
    $('moneyStatus').textContent='Демо-баланс пополнен на '+format(amount)+'.';
  }else{
    if(amount>balance){
      $('moneyStatus').textContent='Недостаточно средств на виртуальном балансе.';
      return;
    }
    balance-=amount;
    updateBalance();
    $('moneyStatus').textContent='Демо-снятие '+format(amount)+' выполнено. Реальный перевод не производился.';
  }
}

function stopFlight(){
  if(flightTimer){clearInterval(flightTimer);flightTimer=null}
  busy=false;
}
function closeGame(){
  stopFlight();
  $('gamePanel').classList.remove('show');
}
function openGame(name){
  stopFlight();
  currentGame=name;
  $('gamePanel').classList.add('show');
  $('gameTitle').textContent={mines:'💣 MINES',aviator:'✈️ AVIATOR',slots:'🎰 SLOTS',dice:'🎲 DICE'}[name];
  $('playButton').disabled=false;
  $('playButton').textContent={mines:'Начать игру',aviator:'Запустить самолёт',slots:'Крутить барабаны',dice:'Бросить кубик'}[name];
  $('playButton').onclick=play;
  if(name==='mines')renderMines();
  if(name==='aviator')renderAviator();
  if(name==='slots')renderSlots();
  if(name==='dice')renderDice();
  $('gamePanel').scrollIntoView({behavior:'smooth',block:'nearest'});
}

function getBet(){
  const n=Number($('bet').value);
  if(!Number.isFinite(n)||n<1000||n>balance||!Number.isInteger(n)){
    $('gameStatus').textContent='Ставка должна быть целым числом от 1 000 до баланса.';
    return 0;
  }
  return n;
}

function renderMines(){
  mine=null;
  $('gameArea').innerHTML='<div class="grid">'+Array.from({length:25},(_,i)=>'<button class="cell" data-cell="'+i+'">?</button>').join('')+'</div>';
  $('gameArea').querySelectorAll('[data-cell]').forEach(cell=>cell.addEventListener('click',()=>pickMine(Number(cell.dataset.cell),cell)));
  $('gameStatus').textContent='Нажми «Начать игру», чтобы открыть клетки.';
}
function playMines(){
  const n=getBet();if(!n)return;
  balance-=n;updateBalance();
  mine={bet:n,bomb:Math.floor(Math.random()*25),opened:[],active:true};
  $('gameArea').querySelectorAll('.cell').forEach(c=>{c.className='cell';c.textContent='?'});
  $('gameStatus').textContent='Открывай клетки или забери выигрыш.';
  $('playButton').textContent='Забрать выигрыш';
  $('playButton').onclick=cashMines;
}
function pickMine(i,cell){
  if(!mine||!mine.active||mine.opened.includes(i))return;
  if(i===mine.bomb){
    cell.classList.add('boom');cell.textContent='💣';
    mine.active=false;
    $('gameArea').querySelectorAll('.cell').forEach((c,j)=>{if(j===mine.bomb){c.textContent='💣';c.classList.add('boom')}});
    $('gameStatus').textContent='Бомба! Ставка потеряна.';
    $('playButton').textContent='Играть ещё';$('playButton').onclick=play;
    return;
  }
  mine.opened.push(i);cell.classList.add('open');cell.textContent='💎';
  const mult=1+mine.opened.length*.18;
  $('gameStatus').textContent='Множитель x'+mult.toFixed(2)+' · Возврат '+format(mine.bet*mult);
}
function cashMines(){
  if(!mine||!mine.active||!mine.opened.length){
    $('gameStatus').textContent='Сначала открой хотя бы одну безопасную клетку.';
    return;
  }
  const win=Math.floor(mine.bet*(1+mine.opened.length*.18));
  mine.active=false;balance+=win;updateBalance();
  $('gameStatus').textContent='Забрано '+format(win)+'! 🎉';
  $('playButton').textContent='Играть ещё';$('playButton').onclick=play;
}

function renderAviator(){
  $('gameArea').innerHTML='<div class="planearea"><div class="mult" id="mult">x1.00</div><span class="plane" id="plane">✈️</span></div>';
  $('gameStatus').textContent='Запусти самолёт и забери виртуальный выигрыш до конца полёта.';
}
function playAviator(){
  const n=getBet();if(!n)return;
  balance-=n;updateBalance();busy=true;flightMultiplier=1;
  const crash=1.3+Math.random()*3.5;
  $('playButton').textContent='Забрать x1.00';
  $('playButton').onclick=()=>cashAviator(n);
  $('gameStatus').textContent='Самолёт взлетел!';
  flightTimer=setInterval(()=>{
    flightMultiplier+=.025+flightMultiplier*.012;
    $('mult').textContent='x'+flightMultiplier.toFixed(2);
    $('plane').style.transform='translate('+Math.min(130,(flightMultiplier-1)*30)+'px,'+(-Math.min(65,(flightMultiplier-1)*15))+'px) rotate(-15deg)';
    $('playButton').textContent='Забрать x'+flightMultiplier.toFixed(2);
    if(flightMultiplier>=crash){
      stopFlight();
      $('plane').textContent='💨';
      $('gameStatus').textContent='Самолёт улетел! Ставка потеряна.';
      $('playButton').textContent='Играть ещё';$('playButton').onclick=play;
    }
  },100);
}
function cashAviator(n){
  if(!busy)return;
  stopFlight();
  const win=Math.floor(n*flightMultiplier);balance+=win;updateBalance();
  $('gameStatus').textContent='Забрано '+format(win)+'! 🎉';
  $('playButton').textContent='Играть ещё';$('playButton').onclick=play;
}

function renderSlots(){
  $('gameArea').innerHTML='<div class="reels"><div class="reel">🍒</div><div class="reel">⭐</div><div class="reel">💎</div></div>';
  $('gameStatus').textContent='Три одинаковых символа дают x5, пара — x2.';
}
function playSlots(){
  const n=getBet();if(!n)return;
  balance-=n;updateBalance();busy=true;
  const reels=[...$('gameArea').querySelectorAll('.reel')];
  const symbols=['🍒','⭐','💎','7️⃣','🔔'];
  reels.forEach(r=>r.classList.add('spin'));
  let ticks=0;
  const timer=setInterval(()=>{
    reels.forEach(r=>r.textContent=symbols[Math.floor(Math.random()*symbols.length)]);
    ticks++;
    if(ticks>=15){
      clearInterval(timer);busy=false;
      reels.forEach(r=>r.classList.remove('spin'));
      const v=reels.map(r=>r.textContent);
      const mult=v.every(x=>x===v[0])?5:((v[0]===v[1]||v[1]===v[2]||v[0]===v[2])?2:0);
      const win=n*mult;
      if(win){balance+=win;updateBalance()}
      $('gameStatus').textContent=win?'🎉 Выигрыш '+format(win):'Нет совпадения. Попробуй ещё!';
      $('playButton').disabled=false;
      $('playButton').textContent='Крутить ещё';
    }
  },100);
  $('playButton').disabled=true;
}

function renderDice(){
  $('gameArea').innerHTML='<div class="dice" id="dice">🎲</div>';
  $('gameStatus').textContent='Выпало 4, 5 или 6 — виртуальный возврат x2.';
}
function playDice(){
  const n=getBet();if(!n)return;
  balance-=n;updateBalance();busy=true;
  const d=$('dice');d.classList.remove('roll');void d.offsetWidth;d.classList.add('roll');
  const faces=['⚀','⚁','⚂','⚃','⚄','⚅'];
  let ticks=0;
  const timer=setInterval(()=>{
    const v=Math.floor(Math.random()*6);
    d.textContent=faces[v];ticks++;
    if(ticks>=9){
      clearInterval(timer);busy=false;
      const win=v>=3?n*2:0;
      if(win){balance+=win;updateBalance()}
      $('gameStatus').textContent=win?'Выпало '+(v+1)+'! Выигрыш '+format(win)+' 🎉':'Выпало '+(v+1)+'. Без выигрыша.';
      $('playButton').disabled=false;$('playButton').textContent='Бросить ещё';
    }
  },100);
  $('playButton').disabled=true;
}

function play(){
  if(busy)return;
  if(currentGame==='mines'){playMines();return}
  if(currentGame==='aviator'){playAviator();return}
  if(currentGame==='slots'){playSlots();return}
  if(currentGame==='dice'){playDice();return}
}

updateBalance();
</script>
</body>
</html>
